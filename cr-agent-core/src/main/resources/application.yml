spring:
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen-max
          temperature: 0.1

cragent:
  mcp-server:
    url: http://localhost:8082
    connect-timeout: 10s
    read-timeout: 30s
  review:
    max-diff-size: 500000
    chunk-size: 200
    sub-agent-timeout: 60
    verification:
      enabled: false
      runs: 3
      timeout-seconds: 60
      confidence-threshold: 0.6
