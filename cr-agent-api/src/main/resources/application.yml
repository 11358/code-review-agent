spring:
  application:
    name: cr-agent-api
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        enabled: true
        options:
          model: qwen-plus
          temperature: 0.1
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 2000
        multiplier: 2

server:
  port: 8080
  netty:
    connection-timeout: 120000

cragent:
  mcp-server:
    url: http://localhost:8082
    connect-timeout: 10s
    read-timeout: 30s
  review:
    max-diff-size: 500000
    chunk-size: 200
    agent-runs: 5
    sub-agent-timeout: 120
    verification:
      enabled: true
      runs: 3
      timeout-seconds: 60
      confidence-threshold: 0.6

logging:
  level:
    com.cragent: DEBUG
